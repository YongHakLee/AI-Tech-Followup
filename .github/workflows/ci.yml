name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # .nvmrc로 고정한다. node-version: 24는 러너가 최신 24.x를 잡는데, 그
          # Node가 번들한 npm 12는 이 저장소의 package-lock.json을 불완전하다고
          # 보고 `npm ci`를 EUSAGE로 거부한다 (@emnapi/runtime·core가 optional
          # wasm 패키지의 의존성으로만 적혀 있고 항목 자체가 없다). npm 11은
          # 통과한다. 락파일을 npm 12로 재생성하려면 Node 24.15+ 가 필요하다.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate:registry
      - run: npm run build
