name: weekly

on:
  schedule:
    # 화요일 00:00 UTC = 화요일 09:00 KST. Actions cron은 항상 UTC다.
    # weekly.ts는 이 시점 기준으로 "직전에 끝난 주"를 대상으로 삼는다.
    - cron: '0 0 * * 2'
  workflow_dispatch:

concurrency:
  group: content-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  highlight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # .nvmrc로 고정한다. node-version: 24는 러너가 최신 24.x를 잡는데, 그
          # Node가 번들한 npm 12는 이 저장소의 package-lock.json을 불완전하다고
          # 보고 `npm ci`를 EUSAGE로 거부한다 (@emnapi/runtime·core가 optional
          # wasm 패키지의 의존성으로만 적혀 있고 항목 자체가 없다). npm 11은
          # 통과한다. 락파일을 npm 12로 재생성하려면 Node 24.15+ 가 필요하다.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 시크릿 확인
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # 키가 없으면 큐레이터가 조용히 실패하고 휴리스틱 폴백으로 내려간다.
          # 폴백은 의도된 동작이지만, 설정 실수 때문에 매주 폴백이 나가는 건 다른 문제다.
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::ANTHROPIC_API_KEY 시크릿이 설정되지 않았습니다"
            exit 1
          fi
      - name: 주간 하이라이트 생성
        run: npm run weekly
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: 변경분 커밋
        run: |
          ./.github/scripts/commit-content.sh "chore(content): 주간 하이라이트 생성"
